<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title">
  <title id="title">Fleet telemetry and logistics operations illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e2f8ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2a4d"/>
      <stop offset="1" stop-color="#123a66"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0073e0"/>
      <stop offset="1" stop-color="#41defd"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#9fc3f6" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#00468c" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00468c" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- map card -->
  <g filter="url(#shadow)">
    <rect x="420" y="140" width="700" height="500" rx="28" fill="#ffffff"/>
  </g>
  <rect x="420" y="140" width="700" height="62" rx="28" fill="#f1f5ff"/>
  <rect x="420" y="176" width="700" height="26" fill="#f1f5ff"/>
  <circle cx="454" cy="171" r="6" fill="#94a8c2"/>
  <circle cx="474" cy="171" r="6" fill="#c3d1e6"/>
  <rect x="500" y="158" width="150" height="26" rx="13" fill="#ffffff" stroke="#dbe7fb"/>
  <text x="516" y="175" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#54637d">FLEET LIVE MAP</text>
  <circle cx="1072" cy="171" r="7" fill="#10b981"/>
  <text x="1014" y="176" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#15803d">LIVE</text>

  <!-- map surface -->
  <g>
    <rect x="446" y="224" width="648" height="390" rx="18" fill="#f4f9ff"/>
    <g stroke="#cfe1f7" stroke-width="1.2">
      <path d="M446 286h648M446 348h648M446 410h648M446 472h648M446 534h648"/>
      <path d="M510 224v390M574 224v390M638 224v390M702 224v390M766 224v390M830 224v390M894 224v390M958 224v390M1022 224v390"/>
    </g>
    <!-- blocks -->
    <g fill="#e3eefb">
      <rect x="470" y="250" width="78" height="52" rx="8"/>
      <rect x="574" y="250" width="104" height="52" rx="8"/>
      <rect x="704" y="250" width="80" height="74" rx="8"/>
      <rect x="810" y="250" width="104" height="52" rx="8"/>
      <rect x="470" y="334" width="60" height="72" rx="8"/>
      <rect x="560" y="334" width="90" height="52" rx="8"/>
      <rect x="694" y="350" width="90" height="56" rx="8"/>
      <rect x="814" y="334" width="100" height="72" rx="8"/>
      <rect x="950" y="250" width="52" height="100" rx="8"/>
      <rect x="950" y="380" width="78" height="60" rx="8"/>
      <rect x="470" y="434" width="100" height="58" rx="8"/>
      <rect x="602" y="434" width="80" height="58" rx="8"/>
      <rect x="712" y="434" width="120" height="58" rx="8"/>
      <rect x="860" y="434" width="76" height="58" rx="8"/>
      <rect x="470" y="522" width="72" height="66" rx="8"/>
      <rect x="572" y="522" width="110" height="66" rx="8"/>
      <rect x="712" y="522" width="88" height="66" rx="8"/>
      <rect x="838" y="522" width="104" height="66" rx="8"/>
    </g>
    <!-- water -->
    <path d="M964 224c24 52 10 98-16 132" stroke="#a9edff" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- routes -->
    <path d="M508 388c54-30 110 20 164-8s98 8 146-18 90 2 130-24" stroke="url(#route)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <path d="M508 388c54-30 110 20 164-8s98 8 146-18 90 2 130-24" stroke="url(#route)" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
    <path d="M618 560c40-44 66-104 106-104s58 54 104 22 56-88 96-88" stroke="#009dbe" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="2 9"/>

    <!-- pins -->
    <g filter="url(#soft)">
      <path d="M760 300c0 16-20 32-20 32s-20-16-20-32a20 20 0 1140 0z" fill="#0073e0"/>
      <circle cx="740" cy="298" r="8" fill="#ffffff"/>
    </g>
    <g filter="url(#soft)">
      <path d="M972 438c0 13-16 26-16 26s-16-13-16-26a16 16 0 1132 0z" fill="#41defd"/>
      <circle cx="956" cy="437" r="6" fill="#062038"/>
    </g>
    <g filter="url(#soft)">
      <path d="M618 508c0 13-16 26-16 26s-16-13-16-26a16 16 0 1132 0z" fill="#009dbe"/>
      <circle cx="602" cy="507" r="6" fill="#ffffff"/>
    </g>

    <!-- moving vehicles -->
    <g filter="url(#soft)">
      <rect x="838" y="334" width="56" height="34" rx="9" fill="#0c2a4d"/>
      <rect x="846" y="342" width="22" height="14" rx="4" fill="#41defd"/>
      <circle cx="850" cy="372" r="6" fill="#12233c"/>
      <circle cx="884" cy="372" r="6" fill="#12233c"/>
    </g>
    <g filter="url(#soft)">
      <rect x="654" y="518" width="48" height="30" rx="8" fill="#0073e0"/>
      <rect x="661" y="525" width="18" height="12" rx="3" fill="#a9edff"/>
      <circle cx="665" cy="552" r="5" fill="#12233c"/>
      <circle cx="693" cy="552" r="5" fill="#12233c"/>
    </g>
  </g>

  <!-- left KPI column -->
  <g filter="url(#soft)">
    <rect x="88" y="140" width="286" height="146" rx="22" fill="#0c2a4d"/>
  </g>
  <rect x="114" y="168" width="64" height="8" rx="4" fill="#6f91b8"/>
  <text x="114" y="212" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">248</text>
  <text x="114" y="232" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#9db9d8">ACTIVE VEHICLES</text>
  <path d="M242 244c14 0 18-26 32-26s16 16 30 16 16-12 30-12" stroke="#41defd" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="334" cy="222" r="4" fill="#41defd"/>

  <g filter="url(#soft)">
    <rect x="88" y="306" width="286" height="146" rx="22" fill="#ffffff"/>
  </g>
  <rect x="114" y="334" width="58" height="8" rx="4" fill="#7d8ea8"/>
  <text x="114" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#12233c">LIVE</text>
  <text x="114" y="398" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#7d8ea8">ROUTE VISIBILITY</text>
  <rect x="114" y="414" width="206" height="8" rx="4" fill="#e8eef9"/>
  <rect x="114" y="414" width="150" height="8" rx="4" fill="#0073e0"/>

  <g filter="url(#soft)">
    <rect x="88" y="472" width="286" height="168" rx="22" fill="#ffffff"/>
  </g>
  <text x="114" y="506" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em" fill="#54637d">DISPATCH QUEUE</text>
  <g>
    <rect x="114" y="524" width="232" height="32" rx="8" fill="#f1f7ff"/>
    <circle cx="132" cy="540" r="5" fill="#10b981"/>
    <rect x="146" y="536" width="86" height="7" rx="3.5" fill="#94a8c2"/>
    <rect x="284" y="534" width="46" height="12" rx="6" fill="#dcfce7"/>
  </g>
  <g>
    <rect x="114" y="564" width="232" height="32" rx="8" fill="#f1f7ff"/>
    <circle cx="132" cy="580" r="5" fill="#f59e0b"/>
    <rect x="146" y="576" width="70" height="7" rx="3.5" fill="#94a8c2"/>
    <rect x="284" y="574" width="46" height="12" rx="6" fill="#fef3c7"/>
  </g>
  <g>
    <rect x="114" y="604" width="232" height="32" rx="8" fill="#f1f7ff"/>
    <circle cx="132" cy="620" r="5" fill="#0073e0"/>
    <rect x="146" y="616" width="96" height="7" rx="3.5" fill="#94a8c2"/>
    <rect x="284" y="614" width="46" height="12" rx="6" fill="#dbeafe"/>
  </g>

</svg>
