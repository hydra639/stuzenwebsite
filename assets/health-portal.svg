<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title">
  <title id="title">Healthcare patient and provider portal illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf7ff"/>
      <stop offset="0.5" stop-color="#f7fcff"/>
      <stop offset="1" stop-color="#e3faf6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0073e0"/>
      <stop offset="1" stop-color="#0050a5"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41defd"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 380) scale(430)">
      <stop stop-color="#41defd" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#41defd" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#00468c" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00468c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#halo)"/>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <rect x="270" y="158" width="660" height="424" rx="22" fill="#0c2a4d"/>
  </g>
  <rect x="284" y="172" width="632" height="396" rx="12" fill="#f8fbff"/>

  <!-- top bar -->
  <rect x="284" y="172" width="632" height="44" rx="12" fill="#eef5ff"/>
  <rect x="284" y="194" width="632" height="22" fill="#eef5ff"/>
  <circle cx="308" cy="194" r="15" fill="#0073e0"/>
  <path d="M308 186v16M300 194h16" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
  <text x="334" y="199" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#12233c">STUZEN HEALTH</text>
  <rect x="708" y="182" width="100" height="24" rx="12" fill="#ffffff" stroke="#dbe7fb"/>
  <text x="724" y="198" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#54637d">PATIENT PORTAL</text>
  <circle cx="874" cy="194" r="14" fill="#dbeafe"/>
  <circle cx="874" cy="190" r="5" fill="#0073e0"/>
  <path d="M864 204c2-6 6-9 10-9s8 3 10 9" fill="#0073e0"/>

  <!-- sidebar -->
  <rect x="302" y="232" width="128" height="316" rx="12" fill="#f1f7ff"/>
  <g>
    <rect x="318" y="250" width="96" height="34" rx="8" fill="#0073e0"/>
    <circle cx="334" cy="267" r="6" fill="#ffffff"/>
    <rect x="348" y="262" width="48" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.9"/>
  </g>
  <g fill="#94a8c2">
    <rect x="318" y="298" width="84" height="7" rx="3.5"/>
    <rect x="318" y="326" width="68" height="7" rx="3.5"/>
    <rect x="318" y="354" width="88" height="7" rx="3.5"/>
    <rect x="318" y="382" width="74" height="7" rx="3.5"/>
  </g>

  <!-- welcome row -->
  <rect x="452" y="232" width="240" height="18" rx="9" fill="#12233c"/>
  <rect x="452" y="260" width="180" height="8" rx="4" fill="#c3d1e6"/>

  <!-- vitals card -->
  <g filter="url(#soft)">
    <rect x="452" y="292" width="214" height="140" rx="16" fill="#ffffff"/>
  </g>
  <text x="472" y="318" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em" fill="#7d8ea8">HEART RATE</text>
  <text x="472" y="346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#12233c">72</text>
  <text x="504" y="346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#7d8ea8">bpm</text>
  <path d="M472 394l20 0 8-20 12 38 12-30 10 12h78" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M472 410h124" stroke="#e8eef9" stroke-width="6" stroke-linecap="round"/>

  <!-- appointment card -->
  <g filter="url(#soft)">
    <rect x="682" y="292" width="214" height="140" rx="16" fill="#e8f8ff"/>
  </g>
  <text x="702" y="318" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em" fill="#0369a1">NEXT APPOINTMENT</text>
  <text x="702" y="348" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#12233c">Thursday, 10:30</text>
  <rect x="702" y="364" width="120" height="7" rx="3.5" fill="#9fb6cc"/>
  <rect x="702" y="394" width="112" height="26" rx="13" fill="#0073e0"/>
  <text x="758" y="411" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Join Video Call</text>

  <!-- doctor list -->
  <g>
    <rect x="452" y="452" width="444" height="96" rx="14" fill="#ffffff"/>
    <circle cx="486" cy="500" r="24" fill="#dbeafe"/>
    <circle cx="486" cy="494" r="8" fill="#0073e0"/>
    <path d="M472 511c3-9 8-13 14-13s11 4 14 13" fill="#0073e0"/>
    <rect x="524" y="480" width="126" height="9" rx="4.5" fill="#12233c"/>
    <rect x="524" y="500" width="92" height="7" rx="3.5" fill="#9fb6cc"/>
    <rect x="784" y="486" width="92" height="26" rx="13" fill="#dcfce7"/>
    <text x="830" y="503" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- laptop base -->
  <path d="M212 582h776l36 40H176l36-40z" fill="#dbe7f6"/>
  <rect x="470" y="594" width="260" height="10" rx="5" fill="#b7cce4"/>

  <!-- floating cross badge -->
  <g filter="url(#soft)">
    <circle cx="1008" cy="230" r="58" fill="#ffffff"/>
  </g>
  <path d="M1008 198v64M976 230h64" stroke="#059669" stroke-width="16" stroke-linecap="round"/>

  <!-- floating security badge -->
  <g filter="url(#soft)">
    <rect x="930" y="500" width="196" height="80" rx="18" fill="#ffffff"/>
  </g>
  <path d="M970 522l14 5v11c0 10-6 18-14 22-8-4-14-12-14-22v-11l14-5z" fill="#0073e0"/>
  <path d="M964 538l5 5 9-10" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="996" y="532" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#12233c">SECURE ACCESS</text>
  <rect x="996" y="542" width="98" height="6" rx="3" fill="#c3d1e6"/>
  <rect x="996" y="554" width="68" height="6" rx="3" fill="#dbe7f6"/>

  <!-- floating pill accents -->
  <g opacity="0.7">
    <rect x="164" y="454" width="96" height="42" rx="21" fill="#41defd" transform="rotate(-18 212 475)"/>
    <path d="M190 462l44 12" stroke="#ffffff" stroke-width="2.4" transform="rotate(-18 212 475)"/>
    <rect x="150" y="328" width="60" height="26" rx="13" fill="#0073e0" fill-opacity="0.16" transform="rotate(14 180 341)"/>
  </g>

</svg>
