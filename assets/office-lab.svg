<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title">
  <title id="title">Modern software engineering laboratory workspace</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#e2ecfa"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe7f6"/>
      <stop offset="1" stop-color="#cddcf0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2a4d"/>
      <stop offset="1" stop-color="#123a66"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf0f9"/>
    </linearGradient>
    <pattern id="blueprint" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#9fc3f6" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#00468c" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00468c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect y="620" width="1200" height="180" fill="url(#floor)"/>

  <!-- window -->
  <g filter="url(#soft)">
    <rect x="694" y="104" width="396" height="310" rx="18" fill="url(#sky)"/>
  </g>
  <g opacity="0.9">
    <rect x="694" y="316" width="396" height="98" fill="#cfe7f8"/>
    <g fill="#b3d6f0">
      <rect x="720" y="244" width="54" height="170" rx="4"/>
      <rect x="786" y="202" width="70" height="212" rx="4"/>
      <rect x="868" y="258" width="46" height="156" rx="4"/>
      <rect x="926" y="222" width="62" height="192" rx="4"/>
      <rect x="1000" y="272" width="58" height="142" rx="4"/>
    </g>
    <g fill="#e8f4ff">
      <rect x="730" y="258" width="10" height="10"/><rect x="748" y="258" width="10" height="10"/>
      <rect x="796" y="216" width="12" height="12"/><rect x="818" y="216" width="12" height="12"/>
      <rect x="796" y="242" width="12" height="12"/><rect x="818" y="242" width="12" height="12"/>
      <rect x="938" y="238" width="10" height="10"/><rect x="958" y="238" width="10" height="10"/>
      <rect x="938" y="264" width="10" height="10"/><rect x="958" y="264" width="10" height="10"/>
      <rect x="1012" y="288" width="10" height="10"/><rect x="1032" y="288" width="10" height="10"/>
    </g>
  </g>
  <rect x="886" y="104" width="10" height="310" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="694" y="254" width="396" height="10" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="694" y="404" width="396" height="14" rx="7" fill="#d5e2f2"/>

  <!-- blueprint board -->
  <g filter="url(#soft)">
    <rect x="110" y="104" width="352" height="258" rx="16" fill="#f8fbff" stroke="#dbe7fb"/>
  </g>
  <rect x="128" y="122" width="316" height="222" rx="10" fill="#eaf3ff"/>
  <rect x="128" y="122" width="316" height="222" rx="10" fill="url(#blueprint)"/>
  <g stroke="#0073e0" stroke-width="2" fill="none">
    <rect x="160" y="158" width="70" height="44" rx="6"/>
    <rect x="278" y="158" width="70" height="44" rx="6"/>
    <rect x="160" y="252" width="70" height="44" rx="6"/>
    <rect x="278" y="252" width="70" height="44" rx="6"/>
    <path d="M230 180h48M230 180v94h48M348 202v28h-50M195 202v50"/>
  </g>
  <g fill="#41defd">
    <circle cx="230" cy="180" r="4"/><circle cx="348" cy="202" r="4"/><circle cx="348" cy="274" r="4"/><circle cx="230" cy="274" r="4"/>
  </g>
  <g fill="#0c2a4d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle">
    <text x="195" y="226">API</text><text x="313" y="226">DATA</text><text x="195" y="320">CACHE</text><text x="313" y="320">EVENT</text>
  </g>
  <rect x="128" y="330" width="86" height="6" rx="3" fill="#9fc3f6"/>

  <!-- pendant lamps -->
  <g stroke="#8296b5" stroke-width="2">
    <path d="M470 58v56M744 58v56"/>
  </g>
  <path d="M438 114h64l-10 22h-44l-10-22z" fill="#0c2a4d"/>
  <path d="M712 114h64l-10 22h-44l-10-22z" fill="#0c2a4d"/>
  <circle cx="470" cy="138" r="5" fill="#ffe8a8"/>
  <circle cx="744" cy="138" r="5" fill="#ffe8a8"/>
  <g opacity="0.18" fill="#ffe8a8">
    <path d="M438 142h64l40 120h-144l40-120z"/>
    <path d="M712 142h64l40 120h-144l40-120z"/>
  </g>

  <!-- desk -->
  <g filter="url(#shadow)">
    <rect x="150" y="486" width="900" height="30" rx="12" fill="url(#desk)"/>
  </g>
  <rect x="196" y="516" width="18" height="132" rx="6" fill="#c3d5ea"/>
  <rect x="986" y="516" width="18" height="132" rx="6" fill="#c3d5ea"/>
  <rect x="196" y="636" width="94" height="10" rx="5" fill="#b7cce4"/>
  <rect x="910" y="636" width="94" height="10" rx="5" fill="#b7cce4"/>

  <!-- monitor left -->
  <g filter="url(#soft)">
    <rect x="268" y="286" width="296" height="184" rx="12" fill="#0c2a4d"/>
  </g>
  <rect x="280" y="298" width="272" height="160" rx="6" fill="url(#screen)"/>
  <rect x="280" y="298" width="272" height="24" rx="6" fill="#123a66"/>
  <circle cx="296" cy="310" r="3.5" fill="#ffb3ab"/>
  <circle cx="308" cy="310" r="3.5" fill="#ffd8a8"/>
  <circle cx="320" cy="310" r="3.5" fill="#9be3c4"/>
  <g stroke-width="5" stroke-linecap="round">
    <path d="M300 350h58" stroke="#41defd"/>
    <path d="M300 370h134" stroke="#0073e0"/>
    <path d="M300 390h100" stroke="#7d8ea8"/>
    <path d="M300 410h150" stroke="#41defd" stroke-opacity="0.7"/>
    <path d="M300 430h88" stroke="#0073e0"/>
    <path d="M470 350h54" stroke="#41defd" stroke-opacity="0.5"/>
    <path d="M470 370h54" stroke="#7d8ea8" stroke-opacity="0.6"/>
    <path d="M470 390h38" stroke="#0073e0" stroke-opacity="0.8"/>
  </g>
  <rect x="386" y="470" width="60" height="16" fill="#b7cce4"/>
  <rect x="356" y="482" width="120" height="8" rx="4" fill="#a5bcd7"/>

  <!-- monitor right -->
  <g filter="url(#soft)">
    <rect x="602" y="328" width="250" height="142" rx="10" fill="#0c2a4d"/>
  </g>
  <rect x="612" y="338" width="230" height="122" rx="5" fill="#f7faff"/>
  <rect x="612" y="338" width="230" height="20" rx="5" fill="#e8eef9"/>
  <rect x="626" y="368" width="72" height="52" rx="6" fill="#e8f8ff"/>
  <path d="M638 402l12-16 10 10 14-22" stroke="#0073e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="710" y="368" width="118" height="8" rx="4" fill="#c3d1e6"/>
  <rect x="710" y="384" width="90" height="8" rx="4" fill="#d7e3f4"/>
  <rect x="710" y="400" width="106" height="8" rx="4" fill="#d7e3f4"/>
  <rect x="626" y="430" width="202" height="8" rx="4" fill="#e8eef9"/>
  <rect x="626" y="430" width="132" height="8" rx="4" fill="#41defd"/>
  <rect x="696" y="470" width="66" height="16" fill="#b7cce4"/>
  <rect x="670" y="482" width="118" height="8" rx="4" fill="#a5bcd7"/>

  <!-- keyboard -->
  <rect x="386" y="500" width="230" height="18" rx="6" fill="#e8eef9"/>
  <g stroke="#c3d1e6" stroke-width="2">
    <path d="M400 506h202M400 512h202"/>
  </g>
  <rect x="726" y="504" width="52" height="12" rx="6" fill="#d7e3f4"/>

  <!-- mug -->
  <rect x="936" y="456" width="38" height="32" rx="7" fill="#0073e0"/>
  <path d="M974 464h10a8 8 0 010 16h-10" stroke="#0073e0" stroke-width="4" fill="none"/>
  <g stroke="#9db9d8" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
    <path d="M946 446v-10M956 448v-14M966 446v-10"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M1044 424c-20-4-30-26-20-42 16 4 26 22 20 42z" fill="#0f766e"/>
    <path d="M1050 430c22-2 34-22 26-40-18 2-30 20-26 40z" fill="#10b981"/>
    <path d="M1046 442c-8-24 2-48 20-56 8 20 0 46-20 56z" fill="#059669"/>
    <path d="M1028 494h48l-7 72h-34l-7-72z" fill="#0c2a4d"/>
    <rect x="1024" y="486" width="56" height="14" rx="7" fill="#123a66"/>
  </g>

  <!-- chair silhouette -->
  <g fill="#b7cce4" opacity="0.9">
    <rect x="806" y="560" width="118" height="84" rx="20"/>
    <rect x="848" y="644" width="34" height="34" rx="10"/>
    <rect x="814" y="678" width="102" height="10" rx="5"/>
    <rect x="834" y="688" width="10" height="20" rx="5"/>
    <rect x="886" y="688" width="10" height="20" rx="5"/>
  </g>

</svg>
