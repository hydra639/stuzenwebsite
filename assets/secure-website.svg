<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title">
  <title id="title">Secure website architecture illustration with protected forms, HTTPS and access control layers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08192f"/>
      <stop offset="0.55" stop-color="#0a2140"/>
      <stop offset="1" stop-color="#061426"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102c52"/>
      <stop offset="1" stop-color="#0a1e39"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 410) scale(360)">
      <stop stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" stroke="#6fa8ff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#halo)"/>

  <!-- Orbit rings -->
  <g stroke="#60a5fa" stroke-opacity="0.24">
    <circle cx="600" cy="410" r="258" stroke-dasharray="8 12"/>
    <circle cx="600" cy="410" r="210" stroke-opacity="0.16"/>
  </g>

  <!-- Connection paths -->
  <g stroke="#41defd" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="7 9">
    <path d="M428 390L474 390"/>
    <path d="M726 390L772 390"/>
    <path d="M600 660L600 690"/>
  </g>
  <g fill="#41defd">
    <circle cx="452" cy="390" r="4"/>
    <circle cx="748" cy="390" r="4"/>
  </g>

  <!-- Central shield -->
  <circle cx="600" cy="410" r="150" fill="#3b82f6" fill-opacity="0.18" filter="url(#glow)"/>
  <g filter="url(#soft)">
    <path d="M600 214L758 277V428C758 528 692 596 600 642C508 596 442 528 442 428V277L600 214Z" fill="url(#shieldFill)" stroke="url(#accent)" stroke-width="3"/>
  </g>
  <path d="M600 250L724 299V425C724 504 673 559 600 598C527 559 476 504 476 425V299L600 250Z" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 7"/>
  <path d="M522 420L576 474L682 358" stroke="url(#accent)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="600" cy="410" r="196" stroke="#41defd" stroke-opacity="0.18"/>
  <text x="600" y="686" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.22em" fill="#93c5fd">SECURITY-CONSCIOUS DELIVERY</text>

  <!-- Left browser panel -->
  <g filter="url(#soft)">
    <rect x="108" y="202" width="336" height="376" rx="24" fill="url(#panel)" stroke="#2f74c0" stroke-opacity="0.55"/>
  </g>
  <rect x="108" y="202" width="336" height="58" rx="24" fill="#123763"/>
  <rect x="108" y="236" width="336" height="24" fill="#123763"/>
  <g fill="#41defd">
    <circle cx="138" cy="231" r="5"/>
    <circle cx="156" cy="231" r="5" fill-opacity="0.55"/>
    <circle cx="174" cy="231" r="5" fill-opacity="0.3"/>
  </g>
  <rect x="198" y="219" width="220" height="24" rx="12" fill="#0b2442" stroke="#24537f"/>
  <g stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round">
    <rect x="212" y="226" width="9" height="7" rx="2"/>
    <path d="M214 226v-2.5a2.5 2.5 0 015 0V226"/>
  </g>
  <text x="230" y="235" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#9fd6ff">https://secure</text>

  <text x="138" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.16em" fill="#d8ecff">SECURE FORM</text>
  <rect x="330" y="283" width="86" height="22" rx="11" fill="#41defd" fill-opacity="0.14" stroke="#41defd" stroke-opacity="0.35"/>
  <text x="373" y="298" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.1em" fill="#8fe8fb">VALIDATED</text>

  <g>
    <rect x="138" y="320" width="276" height="38" rx="9" fill="#0c2545" stroke="#24537f"/>
    <text x="154" y="344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fb3d9">Input validation enabled</text>
    <circle cx="390" cy="339" r="9" fill="#22d3ee" fill-opacity="0.16"/>
    <path d="M386 339l3 3 5-6" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="138" y="370" width="276" height="38" rx="9" fill="#0c2545" stroke="#24537f"/>
    <text x="154" y="394" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fb3d9">CSRF / XSS checks</text>
    <circle cx="390" cy="389" r="9" fill="#22d3ee" fill-opacity="0.16"/>
    <path d="M386 389l3 3 5-6" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="138" y="420" width="276" height="38" rx="9" fill="#0c2545" stroke="#24537f"/>
    <text x="154" y="444" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fb3d9">Session and access rules</text>
    <circle cx="390" cy="439" r="9" fill="#22d3ee" fill-opacity="0.16"/>
    <path d="M386 439l3 3 5-6" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="138" y="482" width="154" height="8" rx="4" fill="#4f7aa6"/>
  <rect x="138" y="500" width="108" height="8" rx="4" fill="#345a82"/>
  <rect x="138" y="528" width="276" height="30" rx="8" fill="#2563eb" fill-opacity="0.24" stroke="#60a5fa" stroke-opacity="0.4"/>
  <g stroke="#93c5fd" stroke-width="2" stroke-linecap="round">
    <path d="M156 543h76"/>
    <path d="M252 543h34"/>
  </g>

  <!-- Right security layers panel -->
  <g filter="url(#soft)">
    <rect x="764" y="228" width="316" height="342" rx="24" fill="url(#panel)" stroke="#2f74c0" stroke-opacity="0.55"/>
  </g>
  <text x="792" y="272" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.16em" fill="#d8ecff">SECURITY LAYERS</text>
  <rect x="792" y="284" width="58" height="5" rx="2.5" fill="url(#accent)"/>

  <g>
    <rect x="792" y="310" width="260" height="64" rx="14" fill="#0c2545" stroke="#24537f"/>
    <rect x="808" y="326" width="32" height="32" rx="9" fill="#0f3b6d"/>
    <g stroke="#41defd" stroke-width="2" stroke-linecap="round">
      <rect x="818" y="337" width="12" height="10" rx="2"/>
      <path d="M821 337v-3a3 3 0 016 0v3"/>
    </g>
    <text x="854" y="338" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.08em" fill="#eaf2ff">HTTPS / SSL-TLS</text>
    <text x="854" y="354" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#8fb3d9">Encrypted transport configuration</text>
    <path d="M1024 336l4 4 7-8" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <rect x="792" y="386" width="260" height="64" rx="14" fill="#0c2545" stroke="#24537f"/>
    <rect x="808" y="402" width="32" height="32" rx="9" fill="#0f3b6d"/>
    <g stroke="#41defd" stroke-width="2" stroke-linecap="round">
      <circle cx="824" cy="414" r="5"/>
      <path d="M814 430c1.5-5 5.5-7.5 10-7.5s8.5 2.5 10 7.5"/>
    </g>
    <text x="854" y="414" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.08em" fill="#eaf2ff">AUTHENTICATION</text>
    <text x="854" y="430" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#8fb3d9">Careful credential and session handling</text>
    <path d="M1024 412l4 4 7-8" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <rect x="792" y="462" width="260" height="64" rx="14" fill="#0c2545" stroke="#24537f"/>
    <rect x="808" y="478" width="32" height="32" rx="9" fill="#0f3b6d"/>
    <g stroke="#41defd" stroke-width="2" stroke-linecap="round">
      <path d="M817 494h14M817 500h14M820 488l-4 4 4 4"/>
    </g>
    <text x="854" y="490" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.08em" fill="#eaf2ff">ACCESS CONTROL</text>
    <text x="854" y="506" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#8fb3d9">Role boundaries and least privilege</text>
    <path d="M1024 488l4 4 7-8" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="792" y="540" width="128" height="16" rx="8" fill="#41defd" fill-opacity="0.12"/>
  <text x="806" y="552" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="0.12em" fill="#8fe8fb">CONTINUOUS REVIEW</text>

  <!-- Bottom chips -->
  <g>
    <rect x="322" y="726" width="176" height="34" rx="17" fill="#0c2545" stroke="#24537f"/>
    <text x="410" y="748" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.1em" fill="#9fd6ff">DEPENDENCY CHECKS</text>
    <rect x="512" y="726" width="176" height="34" rx="17" fill="#0c2545" stroke="#24537f"/>
    <text x="600" y="748" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.1em" fill="#9fd6ff">BASIC SECURITY TESTING</text>
    <rect x="702" y="726" width="176" height="34" rx="17" fill="#0c2545" stroke="#24537f"/>
    <text x="790" y="748" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.1em" fill="#9fd6ff">PERFORMANCE FOCUS</text>
  </g>
</svg>
