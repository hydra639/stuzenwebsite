<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title">
  <title id="title">Distributed software architecture illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08192f"/>
      <stop offset="0.55" stop-color="#0a2140"/>
      <stop offset="1" stop-color="#061426"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102c52"/>
      <stop offset="1" stop-color="#0a1e39"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0073e0"/>
      <stop offset="1" stop-color="#00b4d8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 400) scale(340)">
      <stop stop-color="#41defd" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#41defd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" stroke="#6fa8ff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#halo)"/>

  <!-- connecting paths -->
  <g stroke="#41defd" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="7 9">
    <path d="M600 400L310 240"/>
    <path d="M600 400L890 240"/>
    <path d="M600 400L300 574"/>
    <path d="M600 400L900 574"/>
    <path d="M600 400L600 664"/>
    <path d="M600 400L600 150"/>
  </g>
  <g fill="#41defd">
    <circle cx="450" cy="318" r="4"/>
    <circle cx="746" cy="320" r="4"/>
    <circle cx="458" cy="492" r="4"/>
    <circle cx="744" cy="490" r="4"/>
    <circle cx="600" cy="532" r="4"/>
    <circle cx="600" cy="276" r="4"/>
  </g>

  <!-- central core -->
  <circle cx="600" cy="400" r="150" fill="#41defd" fill-opacity="0.12" filter="url(#glow)"/>
  <g filter="url(#soft)">
    <rect x="482" y="312" width="236" height="176" rx="30" fill="url(#panel)" stroke="#2f74c0" stroke-opacity="0.6"/>
  </g>
  <rect x="482" y="312" width="236" height="54" rx="30" fill="#123763"/>
  <rect x="482" y="336" width="236" height="30" fill="#123763"/>
  <circle cx="514" cy="339" r="7" fill="#41defd"/>
  <text x="532" y="345" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.14em" fill="#bfe8ff">CORE API</text>
  <g fill="#41defd">
    <rect x="510" y="390" width="12" height="12" rx="3"/>
    <rect x="534" y="390" width="12" height="12" rx="3" fill-opacity="0.55"/>
    <rect x="558" y="390" width="12" height="12" rx="3" fill-opacity="0.3"/>
  </g>
  <rect x="510" y="416" width="152" height="8" rx="4" fill="#5f89b8"/>
  <rect x="510" y="432" width="112" height="8" rx="4" fill="#3c618c"/>
  <rect x="510" y="456" width="76" height="20" rx="10" fill="#41defd" fill-opacity="0.16"/>
  <text x="524" y="470" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#8fe8fb">HEALTHY</text>

  <!-- top left: auth -->
  <g filter="url(#soft)">
    <rect x="150" y="168" width="196" height="128" rx="22" fill="url(#panel)" stroke="#235283"/>
  </g>
  <rect x="178" y="196" width="42" height="42" rx="12" fill="#0f3b6d"/>
  <path d="M199 210v10m0 0a8 8 0 100 16 8 8 0 000-16z" stroke="#41defd" stroke-width="2.4" stroke-linecap="round"/>
  <text x="236" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.12em" fill="#d8ecff">AUTH</text>
  <rect x="178" y="254" width="140" height="7" rx="3.5" fill="#3b628e"/>
  <rect x="178" y="269" width="96" height="7" rx="3.5" fill="#2b4c72"/>

  <!-- top right: services -->
  <g filter="url(#soft)">
    <rect x="854" y="168" width="196" height="128" rx="22" fill="url(#panel)" stroke="#235283"/>
  </g>
  <path d="M884 248c-10 0-17-8-17-17 0-10 8-17 17-17 2-12 12-20 24-20 13 0 23 9 24 21 9 1 15 8 15 17 0 9-8 16-17 16h-46z" stroke="#41defd" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="938" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.12em" fill="#d8ecff">SERVICES</text>
  <rect x="882" y="258" width="140" height="7" rx="3.5" fill="#3b628e"/>
  <rect x="882" y="273" width="84" height="7" rx="3.5" fill="#2b4c72"/>

  <!-- bottom left: postgres -->
  <g filter="url(#soft)">
    <rect x="146" y="512" width="200" height="132" rx="22" fill="url(#panel)" stroke="#235283"/>
  </g>
  <ellipse cx="204" cy="548" rx="28" ry="10" fill="#123b6a" stroke="#41defd" stroke-width="2"/>
  <path d="M176 548v22c0 5.5 12.5 10 28 10s28-4.5 28-10v-22" stroke="#41defd" stroke-width="2"/>
  <path d="M176 570v22c0 5.5 12.5 10 28 10s28-4.5 28-10v-22" stroke="#41defd" stroke-width="2"/>
  <text x="252" y="552" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.1em" fill="#d8ecff">DATA</text>
  <rect x="252" y="566" width="68" height="7" rx="3.5" fill="#3b628e"/>
  <rect x="174" y="612" width="144" height="7" rx="3.5" fill="#2b4c72"/>

  <!-- bottom right: event bus -->
  <g filter="url(#soft)">
    <rect x="852" y="512" width="202" height="132" rx="22" fill="url(#panel)" stroke="#235283"/>
  </g>
  <g stroke="#41defd" stroke-width="2.4" stroke-linecap="round">
    <path d="M876 556h70"/>
    <path d="M876 578h48"/>
    <path d="M876 600h62"/>
  </g>
  <g fill="#41defd">
    <circle cx="962" cy="556" r="5"/>
    <circle cx="940" cy="578" r="5"/>
    <circle cx="954" cy="600" r="5"/>
  </g>
  <text x="984" y="568" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#d8ecff">EVENTS</text>
  <rect x="876" y="618" width="120" height="6" rx="3" fill="#2b4c72"/>

  <!-- top node -->
  <g filter="url(#soft)">
    <rect x="506" y="92" width="188" height="76" rx="18" fill="#0d2b50" stroke="#235283"/>
  </g>
  <rect x="528" y="112" width="26" height="26" rx="8" fill="#41defd" fill-opacity="0.15"/>
  <path d="M535 118l8 7-8 7" stroke="#41defd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="566" y="122" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em" fill="#d8ecff">GATEWAY</text>
  <rect x="566" y="134" width="88" height="6" rx="3" fill="#3b628e"/>

  <!-- bottom node -->
  <g filter="url(#soft)">
    <rect x="506" y="636" width="188" height="76" rx="18" fill="#0d2b50" stroke="#235283"/>
  </g>
  <rect x="528" y="656" width="26" height="26" rx="8" fill="#41defd" fill-opacity="0.15"/>
  <path d="M537 662v14m-7-7h13" stroke="#41defd" stroke-width="2.4" stroke-linecap="round"/>
  <text x="566" y="666" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em" fill="#d8ecff">DEPLOY</text>
  <rect x="566" y="678" width="72" height="6" rx="3" fill="#3b628e"/>

</svg>
